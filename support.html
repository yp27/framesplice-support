<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrameSplice 技术支持</title><link rel="stylesheet" href="style.css"></head><body><main><a href="index.html">FrameSplice</a><h1>技术支持</h1>
<h2>怎样生成长截图？</h2><p>在首页选择「滚动截取」，确认共享屏幕，切到目标页面滚动。结束后用系统录制控件或 App 内的「停止并拼接」停止。也可以用 iOS 录屏，再回到 App 导入。</p>
<h2>提示有缺口怎么办？</h2><p>可以点预览中的提示检查相应位置，并回看原录屏。重新录制时，尝试关闭挡住内容的浮层，滚动时给前后画面留出重叠。</p>
<h2>联系开发者</h2><p>请通过 <a href="https://github.com/yp27/framesplice-support/issues/new">FrameSplice 支持页面</a> 报告问题，并说明 iPhone 型号、iOS 版本和操作步骤。请勿附上含个人信息的截图或录屏。</p>
<p><a href="privacy.html">隐私政策</a></p></main></body></html>
